$kind: http-request
description: Creates a device and stores its returned UUID in the collection variable device_id.
url: "{{base_url}}/api/v1/devices"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "AMR-07",
      "type": "amr",
      "location": "Warehouse A",
      "status": "active",
      "metadata": {
        "manufacturer": "Demo Manufacturer",
        "model": "AMR-X1"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', () => pm.response.to.have.status(201));
      pm.test('Response is JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      const body = pm.response.json();
      const device = body.data || body;
      pm.test('Created device has an ID', () => pm.expect(device.id).to.be.a('string').and.not.empty);
      if (device.id) pm.collectionVariables.set('device_id', device.id);
    language: text/javascript
settings: {}
order: 1000
