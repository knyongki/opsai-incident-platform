$kind: http-request
description: Lists registered devices.
url: "{{base_url}}/api/v1/devices"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Response is JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.test('Response contains data', () => pm.expect(pm.response.json()).to.have.property('data'));
    language: text/javascript
settings: {}
order: 2000
