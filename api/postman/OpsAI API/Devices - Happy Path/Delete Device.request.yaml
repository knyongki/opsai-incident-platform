$kind: http-request
description: Deletes the device created by this collection. Run this after the other device requests.
url: "{{base_url}}/api/v1/devices/{{device_id}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 204', () => pm.response.to.have.status(204));
      pm.test('Response body is empty', () => pm.expect(pm.response.text()).to.eql(''));
    language: text/javascript
settings: {}
order: 5000
