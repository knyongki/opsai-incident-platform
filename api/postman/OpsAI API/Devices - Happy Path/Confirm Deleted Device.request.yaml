$kind: http-request
description: Confirms the deleted device is no longer found.
url: "{{base_url}}/api/v1/devices/{{device_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 404', () => pm.response.to.have.status(404));
      pm.test('Uses error envelope', () => pm.expect(pm.response.json()).to.have.property('error'));
    language: text/javascript
settings: {}
order: 6000
