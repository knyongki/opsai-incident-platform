$kind: http-request
url: '{{base_url}}/api/v1/incidents?limit=20&device_id={{incident_device_id}}&status=open&severity=high&alarm_code=DEMO_DOCKING'
method: GET
scripts:
  - type: beforeRequest
    code: |-
      const id = pm.collectionVariables.get('incident_device_id');
      if (!id) throw new Error('Run the incident setup flow first.');
      pm.variables.set('incident_device_id', id);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Filters match the created incident', () => {
        const items = pm.response.json().data.items;
        pm.expect(items).to.be.an('array').and.not.empty;
        pm.expect(items.some(item => item.id === pm.collectionVariables.get('incident_id'))).to.eql(true);
        items.forEach(item => {
          pm.expect(item.device_id).to.eql(pm.collectionVariables.get('incident_device_id'));
          pm.expect(item.status).to.eql('open');
          pm.expect(item.severity).to.eql('high');
          pm.expect(item.alarm_code).to.eql('DEMO_DOCKING');
          pm.expect(item).not.to.have.property('description');
          pm.expect(item).not.to.have.property('raw_logs');
        });
      });
    language: text/javascript
order: 4000
