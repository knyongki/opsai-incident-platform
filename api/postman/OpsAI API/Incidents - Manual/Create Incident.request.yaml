$kind: http-request
url: "{{base_url}}/api/v1/incidents"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "device_id": "{{incident_device_id}}",
      "title": "Demo docking failure",
      "description": "Synthetic incident for local verification.",
      "alarm_code": "DEMO_DOCKING",
      "severity": "high",
      "raw_logs": [
        "Synthetic docking log"
      ],
      "occurred_at": "2026-09-14T09:30:00Z"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.unset('incident_id');
      const id = pm.collectionVariables.get('incident_device_id');
      if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id || '')) {
        throw new Error('Run Create Incident Test Device successfully before Create Incident.');
      }
      pm.variables.set('incident_device_id', id);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 202', () => pm.response.to.have.status(202));
      pm.test('Response is JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.test('Incident is durably queued', () => { const body = pm.response.json(); pm.expect(body).to.have.all.keys('data'); pm.expect(body.data).to.have.all.keys('id', 'status', 'analysis_status'); pm.expect(body.data.id).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i); pm.expect(body.data.status).to.eql('open'); pm.expect(body.data.analysis_status).to.eql('queued'); });
      if (pm.response.code === 202 && pm.response.json().data.id) {
        pm.collectionVariables.set('incident_id', pm.response.json().data.id);
      }
    language: text/javascript
order: 2000
