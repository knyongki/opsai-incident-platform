$kind: http-request
url: '{{base_url}}/api/v1/incidents'
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Response is JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.test('List envelope and page', () => {
        const body = pm.response.json();
        pm.expect(body).to.have.all.keys('data');
        pm.expect(body.data).to.have.all.keys('items', 'page');
        pm.expect(body.data.items).to.be.an('array').with.length.at.most(20);
        pm.expect(body.data.page).to.have.all.keys('next_cursor', 'has_more');
        pm.expect(body.data.page.has_more).to.be.a('boolean');
        if (body.data.page.has_more) pm.expect(body.data.page.next_cursor).to.be.a('string').and.not.empty;
        else pm.expect(body.data.page.next_cursor).to.eql(null);
        body.data.items.forEach(item => {
          pm.expect(item).to.have.all.keys('id', 'device_id', 'title', 'alarm_code', 'severity', 'status', 'analysis_status', 'occurred_at', 'created_at', 'updated_at');
        });
      });
    language: text/javascript
order: 3000
