$kind: http-request
url: '{{base_url}}/api/v1/incidents/{{incident_id}}'
method: GET
scripts:
  - type: beforeRequest
    code: |-
      const id = pm.collectionVariables.get('incident_id');
      if (!id) throw new Error('Run Create Incident successfully first.');
      pm.variables.set('incident_id', id);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Response is JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.test('Complete created incident without internal job fields', () => {
        const body = pm.response.json();
        pm.expect(body).to.have.all.keys('data');
        const item = body.data;
        pm.expect(item).to.have.all.keys('id', 'device_id', 'title', 'description', 'alarm_code', 'severity', 'status', 'analysis_status', 'raw_logs', 'occurred_at', 'created_at', 'updated_at', 'resolved_at');
        pm.expect(item.id).to.eql(pm.collectionVariables.get('incident_id'));
        pm.expect(item.device_id).to.eql(pm.collectionVariables.get('incident_device_id'));
        pm.expect(item.description).to.eql('Synthetic incident for local verification.');
        pm.expect(item.raw_logs).to.deep.eql(['Synthetic docking log']);
        pm.expect(item.analysis_status).to.eql('queued');
        pm.expect(item.resolved_at).to.eql(null);
      });
    language: text/javascript
order: 5000
