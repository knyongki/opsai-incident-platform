$kind: http-request
url: '{{base_url}}/api/v1/incidents/{{incident_id}}'
method: GET
scripts:
  - type: beforeRequest
    code: |-
      const id = pm.collectionVariables.get('incident_id');
      if (!id) throw new Error('Run Create Incident successfully first.');
      pm.variables.set('incident_id', id);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Response is JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.test('Complete created incident without internal job fields', () => {
        const body = pm.response.json();
        pm.expect(body).to.have.all.keys('data');
        const item = body.data;
        pm.expect(item).to.have.all.keys('id', 'device_id', 'title', 'description', 'alarm_code', 'severity', 'status', 'analysis_status', 'raw_logs', 'occurred_at', 'created_at', 'updated_at', 'resolved_at', 'analysis');
        pm.expect(item.id).to.eql(pm.collectionVariables.get('incident_id'));
        pm.expect(item.device_id).to.eql(pm.collectionVariables.get('incident_device_id'));
        pm.expect(item.description).to.eql('Synthetic incident for local verification.');
        pm.expect(item.raw_logs).to.deep.eql(['Synthetic docking log']);
        pm.expect(item.analysis_status).to.be.oneOf(['queued', 'running', 'completed', 'failed']);
        pm.expect(item.resolved_at).to.eql(null);
      });
      // Both fields come from one SQL statement, so they always agree.
      pm.test('Incident status matches the analysis job', () => {
        const item = pm.response.json().data;
        const allowed = {queued: ['open', 'analyzing'], running: ['analyzing'], completed: ['analyzed'], failed: ['analysis_failed']};
        pm.expect(item.status).to.be.oneOf(allowed[item.analysis_status]);
      });
      // Without a worker the job stays queued; a legacy completed job may also have no result.
      pm.test('Analysis is null unless completed, and labeled with its provenance when present', () => {
        const item = pm.response.json().data;
        if (item.analysis_status !== 'completed') pm.expect(item.analysis).to.eql(null);
        if (item.analysis !== null) {
          const a = item.analysis;
          pm.expect(a).to.have.all.keys('id', 'schema_version', 'source', 'model_name', 'prompt_version', 'created_at', 'result');
          pm.expect(a.source).to.be.oneOf(['fake', 'claude', 'openai']);
          pm.expect(a.schema_version).to.eql(1);
          if (a.source === 'fake') {
            pm.expect(a.model_name).to.eql(null);
            pm.expect(a.prompt_version).to.eql(null);
            pm.expect(a.result.confidence).to.eql(0);
          } else {
            pm.expect(a.model_name).to.be.a('string').and.not.empty;
            pm.expect(a.prompt_version).to.be.a('string').and.not.empty;
            pm.expect(a.result.confidence).to.be.within(0, 1);
          }
        }
      });
    language: text/javascript
order: 5000
