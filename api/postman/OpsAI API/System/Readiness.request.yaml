$kind: http-request
description: Checks whether the API and PostgreSQL dependency are ready.
url: "{{base_url}}/ready"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Response is JSON', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json'));
      pm.test('Readiness envelope is correct', () => pm.expect(pm.response.json()).to.deep.eql({data: {status: 'ready'}}));
    language: text/javascript
settings: {}
order: 2000
